[package]
name = "clankistorian"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.43.0", features = ["chat-completion"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
    "tracing",
] }
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["toml"] }
futures-util = "0.3.34"
git2 = "0.21.0"
glob = "0.3.4"
libc = "0.2.191"
notify = "8.2.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.2.0", features = ["serde"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
